[package]
name = "vm-guave"
version = "0.3.0"
description = "VM Guave — gerenciador de máquinas virtuais (QEMU) para Windows e Linux"
edition = "2021"
license = "MIT"
authors = ["Marlon Nunes Vieira"]

[lib]
name = "vm_guave_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
