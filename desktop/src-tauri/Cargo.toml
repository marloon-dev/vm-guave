[package]
name = "vm-guave"
version = "0.4.0"
description = "VM Guave — gerenciador de máquinas virtuais (QEMU) para Windows e Linux"
edition = "2021"
license = "MIT"
authors = ["Marlon Nunes Vieira"]

[lib]
name = "vm_guave_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
dirs = "6"

# QMP por socket Unix também no Windows (AF_UNIX existe desde o Windows 10 1803; QEMU 7.1+).
[target.'cfg(windows)'.dependencies]
uds_windows = "1"
